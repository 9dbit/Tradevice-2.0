name: Copy Staging Validation
on:
  push:
    branches: ['feature/tradevice-copy-foundation-20261011']
    paths: ['tradevice-copy/**', '.github/workflows/copy-staging-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: copy-staging-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python foundation regression tests
        run: |
          python -m pip install -r tradevice-copy/api/requirements-dev.txt
          PYTHONPATH=tradevice-copy/api:tradevice-copy/services python -m pytest tradevice-copy/api/tests tradevice-copy/services -q
      - name: Install pinned web dependencies and generate lockfile
        working-directory: tradevice-copy/web
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
      - name: Unit tests and production build
        working-directory: tradevice-copy/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm test && npm run build && npm run typecheck
      - name: Install Chromium
        working-directory: tradevice-copy/web
        run: npx playwright install --with-deps chromium
      - name: Browser regression and real public staging checks
        working-directory: tradevice-copy/web
        run: npm run test:e2e
      - name: Dependency vulnerability report
        if: always()
        working-directory: tradevice-copy/web
        run: npm audit --omit=dev --json > dependency-audit.json || true
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-staging-validation
          path: |
            tradevice-copy/web/playwright-report
            tradevice-copy/web/test-results
            tradevice-copy/web/dependency-audit.json
            tradevice-copy/web/package-lock.json
          retention-days: 7
      - name: Commit generated dependency lock to development branch only
        if: success() && github.ref == 'refs/heads/feature/tradevice-copy-foundation-20261011'
        run: |
          git add tradevice-copy/web/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(copy): lock tested web dependency graph'
            git push origin HEAD:refs/heads/feature/tradevice-copy-foundation-20261011
          fi
