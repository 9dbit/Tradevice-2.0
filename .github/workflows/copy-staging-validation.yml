name: Copy Staging Validation
on:
  push:
    branches: ['feature/tradevice-copy-foundation-20261011']
    paths: ['tradevice-copy/**', '.github/workflows/copy-staging-validation.yml']
  workflow_dispatch:
    inputs:
      real_pilot_security:
        description: 'Opt-in REAL JWT/RLS validation with two confirmed staging-only pilots'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: copy-staging-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL is ephemeral CI-only. No Supabase credentials or staging data here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradevice_master_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_temporary_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tradevice_master_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASTER_TEST_DATABASE_URL: postgresql://postgres:ci_only_temporary_password@127.0.0.1:5432/tradevice_master_ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python foundation regression tests
        run: |
          python -m pip install -r tradevice-copy/api/requirements-dev.txt
          python -m pip install -r tradevice-copy/worker/requirements.txt
          PYTHONPATH=tradevice-copy/api:tradevice-copy/services:tradevice-copy/worker python -m pytest tradevice-copy/api/tests tradevice-copy/services tradevice-copy/worker -q
      - name: Install pinned web dependencies and generate lockfile
        working-directory: tradevice-copy/web
        run: |
          if test -f package-lock.json; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
      - name: Unit tests and production build
        working-directory: tradevice-copy/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm test && npm run build && npm run typecheck
      - name: Install Chromium
        working-directory: tradevice-copy/web
        run: npx playwright install --with-deps chromium
      - name: Browser regression and real public staging checks
        working-directory: tradevice-copy/web
        run: npm run test:e2e
      - name: Real two-member security gate (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_pilot_security == true }}
        working-directory: tradevice-copy/api
        env:
          COPY_STAGING_PUBLISHABLE_KEY: ${{ secrets.COPY_STAGING_PUBLISHABLE_KEY }}
          COPY_PILOT_A_EMAIL: ${{ secrets.COPY_PILOT_A_EMAIL }}
          COPY_PILOT_A_PASSWORD: ${{ secrets.COPY_PILOT_A_PASSWORD }}
          COPY_PILOT_B_EMAIL: ${{ secrets.COPY_PILOT_B_EMAIL }}
          COPY_PILOT_B_PASSWORD: ${{ secrets.COPY_PILOT_B_PASSWORD }}
        run: python scripts/real_member_acceptance.py
      - name: Dependency vulnerability report
        if: always()
        working-directory: tradevice-copy/web
        run: npm audit --omit=dev --json > dependency-audit.json || true
      - name: Save test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-staging-validation
          path: |
            tradevice-copy/web/playwright-report
            tradevice-copy/web/test-results
            tradevice-copy/web/dependency-audit.json
            tradevice-copy/web/package-lock.json
          retention-days: 7
      - name: Commit generated dependency lock to development branch only
        if: success() && github.ref == 'refs/heads/feature/tradevice-copy-foundation-20261011'
        run: |
          git add tradevice-copy/web/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(copy): lock tested web dependency graph'
            git push origin HEAD:refs/heads/feature/tradevice-copy-foundation-20261011
          fi
